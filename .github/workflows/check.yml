name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Generated client files are current
        run: python3 scripts/sync-shared.py --check
      - name: Mission Control hooks
        run: sh plugins/mission-control/scripts/test-hooks.sh
